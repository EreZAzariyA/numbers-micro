name: Build and Test Service Registry

on:
  push:
    branches:
      - 'master'
      - 'release'
    paths:
      - 'services-registry/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'
      - name: Install dependencies for services-registry
        working-directory: ./services-registry
        run: npm install
      - name: Compile TypeScript
        working-directory: ./services-registry
        run: npx tsc
